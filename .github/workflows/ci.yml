name: CI

# Analisis statis berjalan pada setiap push/PR. Pengujian dan build rilis
# sengaja digerbangi variabel repositori agar tidak berjalan selama fase
# implementasi. Setelah fase pengujian disetujui:
#   Settings > Secrets and variables > Actions > Variables
#   ENABLE_TESTS=true, ENABLE_RELEASE_BUILD=true
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze aplikasi
        working-directory: pusatkupos
        run: |
          flutter pub get
          dart analyze lib
      - name: Analyze relay
        working-directory: relay
        run: |
          dart pub get
          dart analyze lib bin

  test:
    if: ${{ vars.ENABLE_TESTS == 'true' }}
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Test aplikasi
        working-directory: pusatkupos
        run: |
          flutter pub get
          flutter test
      - name: Test relay
        working-directory: relay
        run: |
          dart pub get
          dart test

  release-build:
    if: ${{ vars.ENABLE_RELEASE_BUILD == 'true' }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Siapkan kunci dan konfigurasi
        working-directory: pusatkupos
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          flutter pub get
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          fi
          if [ -n "$KEY_PROPERTIES" ]; then
            printf '%s' "$KEY_PROPERTIES" > android/key.properties
          fi
          if [ -n "$APP_ENV" ]; then
            printf '%s' "$APP_ENV" > .env
          fi
      - name: Build APK rilis
        working-directory: pusatkupos
        run: flutter build apk --release --dart-define-from-file=.env
      - uses: actions/upload-artifact@v4
        with:
          name: pusatkupos-release-apk
          path: pusatkupos/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
